name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (yarn)
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install root npm deps
        run: npm install

      - name: Build web frontend
        run: npm run build:web

      - name: Cargo check (Tauri)
        run: cargo check --manifest-path src-tauri/Cargo.toml

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          response=$(curl -sS -i -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}" \
            -A "github-actions-dokploy-deploy/1.0" \
            -H "Accept: */*" \
            -w '\n__CURL_STATUS__:%{http_code}\n__CURL_TIME__:%{time_total}s\n')
          echo "===== Full response (status line + headers + body) ====="
          echo "$response"
          echo "=========================================================="
          status=$(echo "$response" | grep '__CURL_STATUS__:' | tail -1 | cut -d: -f2)
          if [ -z "$status" ] || [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dokploy webhook call failed with HTTP status '$status' -- see full response above (look for cf-ray/server headers or a Cloudflare block page in the body)"
            exit 1
          fi
          echo "Dokploy webhook succeeded with HTTP $status"
