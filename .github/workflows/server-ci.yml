name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
  pull_request:
    branches: [main]
    paths:
      - "server/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Cargo check
        run: cargo check --manifest-path server/Cargo.toml --all-targets

      - name: Cargo test
        run: cargo test --manifest-path server/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets
