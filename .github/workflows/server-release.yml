name: Release server

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            os_name: linux
            bin_name: excalidraw-server
          - platform: macos-latest
            os_name: macos
            bin_name: excalidraw-server
          - platform: windows-latest
            os_name: windows
            bin_name: excalidraw-server.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Cargo build (release)
        run: cargo build --release --manifest-path server/Cargo.toml

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          artifact="excalidraw-server-${{ matrix.os_name }}-${{ runner.arch }}"
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            artifact="${artifact}.exe"
          fi
          cp "server/target/release/${{ matrix.bin_name }}" "dist/${artifact}"
          echo "artifact_path=dist/${artifact}" >> "$GITHUB_ENV"
          echo "artifact_name=${artifact}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_path }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine image version tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/linventif/excalidraw-app-server:${{ steps.version.outputs.version }}
            ghcr.io/linventif/excalidraw-app-server:latest

  release:
    needs: [build-binaries, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "Excalidraw Server ${{ github.ref_name }}"
          draft: true
          prerelease: false
          files: dist/*
