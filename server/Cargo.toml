[package]
name = "excalidraw-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
socketioxide = { version = "0.14", features = ["state"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
bytes = "1.12.1"
crypto_box = "0.9.1"
uuid = { version = "1.26.1", features = ["v4"] }
base64 = "0.23.1"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["full"] }
